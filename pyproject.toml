[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sutradhara"
version = "0.0.1"
description = "Orchestrator above Remanence — content-addressed media archive catalog and job engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Ada Operator" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Archiving",
]

# Runtime dependencies — kept minimal at the day-1 vertical slice. New deps
# land alongside the feature that needs them (see docs/spec-v0.1.md §11
# for the committed stack and §12.3 for sequencing).
dependencies = [
    "cbor2>=5.6",
    "click>=8.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "grpcio>=1.60",
    "protobuf>=4.25",
    "zstandard>=0.23",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "bagit>=1.9.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "grpcio-tools>=1.60",
    "types-protobuf>=4.25",
]

[project.scripts]
sutra = "sutradhara.cli.main:cli"

[project.urls]
Homepage = "https://github.com/archivetechie/sutradhara"
Repository = "https://github.com/archivetechie/sutradhara"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sutradhara = ["py.typed"]

# Generated proto stubs live under src/sutradhara/_proto/ and are committed
# (per grpcio convention) for reproducibility. Regenerate via:
#   ./scripts/regenerate-proto.sh
# after editing proto/layer5.proto.

# --- pytest ---------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "error",
    # SQLAlchemy 2.0 emits some deprecation warnings from its own internals
    # during model setup; ignore those to keep CI signal high.
    "ignore::DeprecationWarning:sqlalchemy",
]

# --- ruff -----------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [
    "src/sutradhara/_proto",      # generated by grpcio-tools
    "alembic/versions",         # generated by alembic revision
    "alembic/script.py.mako",   # alembic template
]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "PT",            # pytest style
    "RET",           # return statements
    "RUF",           # ruff-specific
]
ignore = [
    "E501",          # line length (handled by formatter)
    "B008",          # function call in default arg (click idiom)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]  # assert False is fine in tests

[tool.ruff.format]
quote-style = "double"

# --- mypy -----------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_unreachable = true
disallow_any_generics = true
exclude = ["src/sutradhara/_proto/.*", "alembic/.*"]

[[tool.mypy.overrides]]
module = ["grpc", "grpc.*"]
ignore_missing_imports = true
