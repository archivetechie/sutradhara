[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sutra-agent"
version = "0.0.1"
description = "Operator-facing edge agent for Sutradhara receive workflows."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [{ name = "Ada Operator" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Archiving",
]
dependencies = [
    "grpcio>=1.60",
    # Floor must be >= the generated _proto gencode version (currently 6.33.5),
    # or `import device_pb2` raises a protobuf runtime/gencode VersionError.
    "protobuf>=6.33.5",
    "sutradhara-receive==0.0.1",
]

[project.scripts]
sutra-agent = "sutra_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sutra_agent = ["py.typed", "_proto/*.pyi"]
