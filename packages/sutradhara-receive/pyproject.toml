[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "sutradhara-receive"
version = "0.1.0"
description = "Dependency-light receive filesystem contract for Sutradhara."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [{ name = "ArchiveTech contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Archiving",
]
dependencies = []

[project.scripts]
sutra-receive = "sutradhara_receive.cli:main"

[tool.maturin]
python-source = "src"
module-name = "sutradhara_receive._native"
bindings = "pyo3"
features = ["python"]
include = ["src/sutradhara_receive/py.typed"]
