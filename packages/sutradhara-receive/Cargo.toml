[package]
name = "sutradhara-receive"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Dependency-light receive filesystem contract for Sutradhara."

[lib]
name = "sutradhara_receive"
path = "rust/src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3"]

[[test]]
name = "fixtures"
path = "rust/tests/fixtures.rs"

[[bin]]
name = "sutra-receive"
path = "rust/src/bin/sutra-receive.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = "0.3"
unicode-normalization = "0.1"
uuid = { version = "1", default-features = false, features = ["v4"] }
pyo3 = { version = "0.29", optional = true }

[dev-dependencies]
filetime = "0.2"
tempfile = "3"
