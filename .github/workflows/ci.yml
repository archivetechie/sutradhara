name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remanence-binaries:
    name: pinned Remanence binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: archivetechie/remanence
          # pin: remanence main after wire presence
          ref: 15e573094dc1d46b61cc6520844a563d3a8d2c5b
          path: .ci/remanence
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.95.0"
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - run: cargo build --manifest-path .ci/remanence/Cargo.toml --bin rem --bin rem-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: remanence-binaries
          path: |
            .ci/remanence/target/debug/rem
            .ci/remanence/target/debug/rem-daemon
          retention-days: 1

  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: remanence-binaries
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.16"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --extra dev
      # `rem archive build` needs bsdtar (libarchive) for pinned .remwrap.tar fidelity.
      - name: Install libarchive tools
        run: sudo apt-get update && sudo apt-get install --yes libarchive-tools
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: remanence-binaries
          path: ${{ runner.temp }}/rem-bin
      - run: chmod +x "${{ runner.temp }}/rem-bin/rem" "${{ runner.temp }}/rem-bin/rem-daemon"
      - run: uv run pytest -q
        env:
          REM_BIN: ${{ runner.temp }}/rem-bin/rem
          REM_DAEMON_BIN: ${{ runner.temp }}/rem-bin/rem-daemon
      - run: python -m unittest discover -s scripts -p 'test_release_evidence.py'

  quality:
    name: lint, format, types, generated contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run ruff check src tests packages/sutradhara-receive/src
      - run: uv run ruff format --check src tests packages/sutradhara-receive/src
      - run: uv run python scripts/check-mypy-baseline.py
      - name: Verify committed protobuf stubs
        run: |
          ./scripts/regenerate-proto.sh
          git diff --exit-code -- proto src/sutradhara/_proto

  remanence-wire:
    name: pinned rem-daemon wire proof
    runs-on: ubuntu-latest
    needs: remanence-binaries
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: remanence-binaries
          path: ${{ runner.temp }}/rem-bin
      - run: chmod +x "${{ runner.temp }}/rem-bin/rem-daemon"
      - name: Run real-daemon read/planning contract
        env:
          REM_DAEMON_BIN: ${{ runner.temp }}/rem-bin/rem-daemon
        run: uv run pytest -q tests/test_read_ordering_live.py
