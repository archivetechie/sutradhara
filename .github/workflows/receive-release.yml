name: Receive Release

on:
  pull_request:
    paths:
      - ".github/workflows/receive-release.yml"
      - "packages/sutradhara-receive/**"
  push:
    branches:
      - main
    tags:
      - "sutradhara-receive-v*"
    paths:
      - ".github/workflows/receive-release.yml"
      - "packages/sutradhara-receive/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PACKAGE_DIR: packages/sutradhara-receive
  BIN_NAME: sutra-receive

jobs:
  full-ci:
    uses: ./.github/workflows/ci.yml
  version:
    name: version guard
    needs: full-ci
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.version.outputs.package-version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.95.0"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - name: Verify package version
        id: version
        run: |
          set -euo pipefail
          cargo_version="$(
            cargo metadata \
              --manifest-path "$PACKAGE_DIR/Cargo.toml" \
              --no-deps \
              --format-version 1 \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])'
          )"
          pyproject_version="$(
            python3 - "$PACKAGE_DIR/pyproject.toml" <<'PY'
          import sys
          import tomllib

          with open(sys.argv[1], "rb") as handle:
              print(tomllib.load(handle)["project"]["version"])
          PY
          )"
          if [ "$cargo_version" != "$pyproject_version" ]; then
            echo "::error::Cargo version $cargo_version does not match pyproject version $pyproject_version"
            exit 1
          fi
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            expected="sutradhara-receive-v$cargo_version"
            if [ "${GITHUB_REF_NAME:-}" != "$expected" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME:-<unknown>} does not match package version $expected"
              exit 1
            fi
          fi
          echo "package-version=$cargo_version" >> "$GITHUB_OUTPUT"
      - name: Verify release source and main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_evidence.py gate --output eligibility/eligibility.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: receive-eligibility
          path: eligibility/eligibility.json
          if-no-files-found: error
      - name: Test Rust receive core and shared fixtures
        run: cargo test --locked --manifest-path "$PACKAGE_DIR/Cargo.toml"
      - name: Verify Python-generated fixture corpus
        run: |
          uv run python "$PACKAGE_DIR/scripts/extract_fixtures.py"
          git diff --exit-code -- "$PACKAGE_DIR/fixtures"

  manylinux-wheel:
    name: manylinux wheel
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build manylinux wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: ${{ env.PACKAGE_DIR }}
          command: build
          args: --release --locked --out dist --find-interpreter
          maturin-version: "1.12.6"
          rust-toolchain: "1.95.0"
          container: quay.io/pypa/manylinux_2_28_x86_64@sha256:ae21cd1c8220f773f9b5934f3b845d677494d4cd4b8981c1e416f654e8afa74e
          manylinux: "2_28"
          before-script-linux: |
            rustc -vV > rust-toolchain.txt
            cargo -V > cargo-toolchain.txt
          target: x86_64
          sccache: true
      - name: Record wheel build
        run: python scripts/release_evidence.py record --name manylinux --dist "$PACKAGE_DIR/dist" --lock uv.lock --lock "$PACKAGE_DIR/Cargo.lock" --rust-version-file "$PACKAGE_DIR/rust-toolchain.txt" --cargo-version-file "$PACKAGE_DIR/cargo-toolchain.txt"
      - name: Upload wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: receive-wheel-manylinux-x86_64
          path: ${{ env.PACKAGE_DIR }}/dist/*
          if-no-files-found: error

  linux-binaries:
    name: linux binary (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: sutra-receive-x86_64-unknown-linux-gnu
          - target: x86_64-unknown-linux-musl
            artifact: sutra-receive-x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}
      - name: Install musl linker
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build binary
        run: |
          cargo build --locked \
            --manifest-path "$PACKAGE_DIR/Cargo.toml" \
            --release \
            --bin "$BIN_NAME" \
            --target "${{ matrix.target }}"
      - name: Package binary
        run: |
          set -euo pipefail
          mkdir -p "dist/${{ matrix.artifact }}"
          cp "$PACKAGE_DIR/target/${{ matrix.target }}/release/$BIN_NAME" \
            "dist/${{ matrix.artifact }}/$BIN_NAME"
          tar -C dist -czf "dist/${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"
      - name: Record build inputs
        run: python scripts/release_evidence.py record --name ${{ matrix.target }} --dist dist --lock uv.lock --lock "$PACKAGE_DIR/Cargo.lock"
      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: receive-binary-${{ matrix.target }}
          path: |
            dist/${{ matrix.artifact }}.tar.gz
            dist/build-*.json
          if-no-files-found: error

  macos-universal-binary:
    name: macOS universal2 binary
    runs-on: macos-latest
    needs: version
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.95.0"
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Build binary slices
        run: |
          cargo build --locked \
            --manifest-path "$PACKAGE_DIR/Cargo.toml" \
            --release \
            --bin "$BIN_NAME" \
            --target x86_64-apple-darwin
          cargo build --locked \
            --manifest-path "$PACKAGE_DIR/Cargo.toml" \
            --release \
            --bin "$BIN_NAME" \
            --target aarch64-apple-darwin
      - name: Create universal2 binary
        run: |
          set -euo pipefail
          artifact="sutra-receive-universal2-apple-darwin"
          mkdir -p "dist/$artifact"
          lipo -create \
            "$PACKAGE_DIR/target/x86_64-apple-darwin/release/$BIN_NAME" \
            "$PACKAGE_DIR/target/aarch64-apple-darwin/release/$BIN_NAME" \
            -output "dist/$artifact/$BIN_NAME"
          lipo -verify_arch x86_64 arm64 "dist/$artifact/$BIN_NAME"
      - name: Sign and notarize
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          binary="dist/sutra-receive-universal2-apple-darwin/$BIN_NAME"
          zip_path="dist/sutra-receive-universal2-apple-darwin.zip"
          required=(
            APPLE_DEVELOPER_ID_CERTIFICATE_BASE64
            APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD
            APPLE_CODESIGN_IDENTITY
            APPLE_ID
            APPLE_TEAM_ID
            APPLE_APP_SPECIFIC_PASSWORD
          )
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
              printf '::error::Missing macOS signing secret: %s\n' "${missing[@]}"
              exit 1
            fi
            printf 'Signing and notarization skipped for non-tag build; missing: %s\n' "${missing[*]}"
            ditto -c -k --keepParent "$binary" "$zip_path"
            exit 0
          fi

          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/receive-signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$APPLE_DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -P "$APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain"
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain"

          codesign \
            --force \
            --options runtime \
            --timestamp \
            --sign "$APPLE_CODESIGN_IDENTITY" \
            "$binary"
          codesign --verify --strict --verbose=2 "$binary"
          ditto -c -k --keepParent "$binary" "$zip_path"
          xcrun notarytool submit "$zip_path" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
      - name: Record build inputs
        run: python scripts/release_evidence.py record --name universal2-apple-darwin --dist dist --lock uv.lock --lock "$PACKAGE_DIR/Cargo.lock"
      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: receive-binary-universal2-apple-darwin
          path: |
            dist/sutra-receive-universal2-apple-darwin.zip
            dist/build-*.json
          if-no-files-found: error

  windows-binary:
    name: Windows binary
    runs-on: windows-latest
    needs: version
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.95.0"
      - name: Build binary
        shell: pwsh
        run: |
          cargo build --locked `
            --manifest-path "$env:PACKAGE_DIR/Cargo.toml" `
            --release `
            --bin "$env:BIN_NAME"
      - name: Package binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $artifact = "sutra-receive-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force -Path "dist/$artifact"
          Copy-Item "$env:PACKAGE_DIR/target/release/$env:BIN_NAME.exe" "dist/$artifact/$env:BIN_NAME.exe"
          Compress-Archive -Path "dist/$artifact" -DestinationPath "dist/$artifact.zip" -Force
      - name: Record build inputs
        shell: bash
        run: python scripts/release_evidence.py record --name x86_64-pc-windows-msvc --dist dist --lock uv.lock --lock "$PACKAGE_DIR/Cargo.lock"
      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: receive-binary-x86_64-pc-windows-msvc
          path: |
            dist/sutra-receive-x86_64-pc-windows-msvc.zip
            dist/build-*.json
          if-no-files-found: error

  checksums:
    name: checksums
    runs-on: ubuntu-latest
    needs:
      - manylinux-wheel
      - linux-binaries
      - macos-universal-binary
      - windows-binary
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: receive-*
          merge-multiple: true
      - name: Validate builds and generate release manifest
        run: >-
          python scripts/release_evidence.py manifest --dist dist --lock uv.lock --lock "$PACKAGE_DIR/Cargo.lock"
          --require-build manylinux --require-build x86_64-unknown-linux-gnu
          --require-build x86_64-unknown-linux-musl --require-build universal2-apple-darwin
          --require-build x86_64-pc-windows-msvc
      - name: Attest release payload and manifest
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Upload checksummed release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: receive-release-files
          path: dist/*
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
