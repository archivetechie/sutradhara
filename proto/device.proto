syntax = "proto3";

package sutradhara.device;

service DeviceService {
  rpc Connect(stream DeviceMessage) returns (stream ServerCommand);
}

enum CardKind {
  CARD_KIND_UNSPECIFIED = 0;
  CARD_KIND_CARD = 1;
  CARD_KIND_DRIVE = 2;
  CARD_KIND_OTHER = 3;
}

enum CommandAckStatus {
  COMMAND_ACK_STATUS_UNSPECIFIED = 0;
  COMMAND_ACK_STATUS_ACCEPTED = 1;
  COMMAND_ACK_STATUS_REJECTED = 2;
}

message DeviceMessage {
  oneof payload {
    CardSnapshot card_snapshot = 1;
    Heartbeat heartbeat = 2;
    CommandAck command_ack = 3;
    ActiveReceives active_receives = 4;
    DirectoryListing directory_listing = 5;
  }
}

message CardSnapshot {
  repeated Card cards = 1;
  repeated string capabilities = 2;
}

message Card {
  string card_id = 1;
  string label = 2;
  CardKind kind = 3;
  int64 size_bytes = 4;
  string status = 5;
}

message Heartbeat {}

message CommandAck {
  string command_id = 1;
  CommandAckStatus status = 2;
  string reason = 3;
  string intake_id = 4;
}

message ActiveReceives {
  repeated ActiveReceive receives = 1;
}

message ActiveReceive {
  string card_id = 1;
  string idempotency_key = 2;
  string intake_id = 3;
  string state = 4;
}

message ServerCommand {
  oneof payload {
    StartReceive start_receive = 1;
    ListDirectory list_directory = 2;
  }
}

message StartReceive {
  string command_id = 1;
  string card_id = 2;
  string artifactclass = 3;
  string label = 4;
  string source_ref = 5;
  string idempotency_key = 6;
}

message ListDirectory {
  string request_id = 1;
  string card_id = 2;
  string rel_path = 3;
}

message DirectoryEntry {
  string name = 1;
  bool is_dir = 2;
  int64 size_bytes = 3;
  bool is_package = 4;
}

enum DirectoryStatus {
  DIR_STATUS_UNSPECIFIED = 0;
  DIR_STATUS_OK = 1;
  DIR_STATUS_NOT_FOUND = 2;
  DIR_STATUS_NOT_A_DIRECTORY = 3;
  DIR_STATUS_PERMISSION_DENIED = 4;
  DIR_STATUS_CONFINEMENT_VIOLATION = 5;
  DIR_STATUS_CARD_UNAVAILABLE = 6;
  DIR_STATUS_IO_ERROR = 7;
}

message DirectoryListing {
  string request_id = 1;
  repeated DirectoryEntry entries = 2;
  bool truncated = 3;
  DirectoryStatus status = 4;
  string detail = 5;
}
